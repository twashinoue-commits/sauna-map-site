name: Sync from Google Sheet

# Triggered by the Apps Script bound to the "サウナ部活動報告" spreadsheet
# (apps-script/Code.gs), which sends the whole sheet as client_payload.rows.
on:
  repository_dispatch:
    types: [sheet-updated]

permissions:
  contents: write

concurrency:
  group: sync-from-sheet
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Save sheet rows
        env:
          ROWS: ${{ github.event.client_payload.rows }}
        run: printf '%s' "$ROWS" > "$RUNNER_TEMP/rows.json"

      - name: Rebuild data.json
        env:
          ROWS_FILE: ${{ runner.temp }}/rows.json
          POSTER_SALT: ${{ secrets.POSTER_SALT }}
        run: node scripts/sync.js

      - name: Commit if changed
        run: |
          git config user.name "sauna-map-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json coords.json poster-map.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Sync from Google Sheet"
            git push
          fi
